name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # TODO: re-add `cache: pnpm` to setup-node once a pnpm-lock.yaml is
      # committed; the cache step fails on repos without a lockfile.
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
